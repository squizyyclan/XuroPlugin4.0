  starter:
    name: "<green><bold>Starter-Kit"
    icon: IRON_PICKAXE
    cooldown: -1
    permission: "smpcore.kit.starter"
    description: ["<gray>Dein Start auf dem Server – nur <white>einmal<gray>!"]
