# Kits: /kit (Menü mit Vorschau) oder /kit <id>.  /kit preview <id> zeigt alle Items.
# cooldown in Sekunden: -1 = nur einmal, 0 = jederzeit.  permission leer = für alle.
# Rang-Kits: Ränge erhalten smpcore.kit.<rang> automatisch (ranks.yml, wird nach oben vererbt).
# Items: material, amount, name, lore, unbreakable, enchants (Name: Stufe), trim (pattern + material, nur Rüstung),
#        effects (nur POTION, z.B. strength: {seconds: 180, level: 2}).
# Trim-Muster: sentry dune coast wild ward eye vex tide snout rib spire wayfinder shaper silence raiser host flow bolt
# Trim-Materialien: quartz iron netherite redstone copper gold emerald diamond lapis amethyst resin
# Rüstung wird automatisch angezogen, wenn der Slot frei ist (equip: false pro Kit schaltet das ab).
# Elytra stehen auf der shop-blacklist und werden aus Kits automatisch entfernt.
